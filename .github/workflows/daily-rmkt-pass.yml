name: Daily RETARGETING kill+prune

# 2026-10-11 (Nikhil): now DAILY like the DEL_SCALE kill pass - see rmkt_daily_pass.py. Posts to #demand-reports + DM.
# Was: Monday-morning review of the RETARGETING ad set, DM-only for now (not promoted to
# #demand-reports yet - see rmkt_weekly_pass.py). Same 3-attempt dashboard-readiness retry
# pattern as daily-rule-pass.yml, since rmkt_weekly_pass.py uses the same readiness gate -
# just all three attempts land on Monday instead of every day.
#   08:19 UTC Mon = 13:49 IST - attempt 1
#   10:19 UTC Mon = 15:49 IST - attempt 2
#   12:19 UTC Mon = 17:49 IST - attempt 3 (last retry - alerts DM instead of quietly
#                                postponing if data is still not ready)
#
# Minute offset (2026-09-16): staggered off the round hour along with every
# other daily/weekly pass in this repo, to avoid GH Actions' round-minute
# cron congestion (see daily-rule-pass.yml for the full writeup). This is
# a weekly kill+prune pass with real kill logic (unlike Bharat's advisory-
# only ranking), so it gets the fourth offset (+19 min).
on:
  schedule:
    - cron: '19 8 * * *'
    - cron: '19 10 * * *'
    - cron: '19 12 * * *'
  workflow_dispatch: {}

jobs:
  rmkt-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # Missing on this workflow since it was created - dashboard_readiness.py's
        # get_actual_google_spend_day() needs the google-ads package, so every
        # scheduled run since inception silently failed the readiness check
        # ("No module named 'google'" -> actual=n/a -> never ready) and gave up
        # without ever running the real RETARGETING logic. Found 2026-09-08 by
        # checking actual run logs instead of assuming the schedule = success.
        run: |
          pip install google-ads google-auth
      - name: Determine retry attempt
        id: retry
        run: |
          case "${{ github.event.schedule }}" in
            "19 8 * * *")  echo "flag=" >> "$GITHUB_OUTPUT" ;;
            "19 10 * * *") echo "flag=" >> "$GITHUB_OUTPUT" ;;
            "19 12 * * *") echo "flag=--last-retry" >> "$GITHUB_OUTPUT" ;;
            *)            echo "flag=--last-retry" >> "$GITHUB_OUTPUT" ;;  # workflow_dispatch - one shot
          esac
      - name: Run daily RETARGETING pass and post to Slack (#demand-reports + DM)
        run: python rmkt_daily_pass.py ${{ steps.retry.outputs.flag }}
        env:
          WIOM_DASHBOARD_TOKEN: ${{ secrets.WIOM_DASHBOARD_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          # dashboard_readiness.py's own actual-spend cross-check needs Google Ads
          # creds too (get_actual_google_spend_day()) - missing here caused
          # actual_total to silently come back None ("actual=n/a" in the run log)
          # on 2026-09-07, so is_dashboard_data_ready() could never return True and
          # both scheduled runs gave up without ever doing real work. Same mistake
          # daily-rule-pass.yml already avoided by including all of these.
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # SLACK_DM_USER_ID defaults to U05A9037VFG. Override here only if it changes.
      - name: Commit readiness state + RMKT kill log
        # Same pattern as daily-rule-pass.yml's own commit step - own file
        # (rmkt_weekly_readiness_state.json), so nothing to merge/conflict against
        # the daily pass's or budget-shift-pass's own state files.
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          for f in rmkt_daily_readiness_state.json rmkt_kill_pass_log.json rmkt_kill_action_log.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if true; then
            if ! git diff --cached --quiet; then
              git commit -m "rmkt-daily state + kill log: $(date -u +%Y-%m-%d)"
              for i in 1 2 3 4 5; do
                if git push; then
                  break
                fi
                echo "push rejected (attempt $i) - fetching + merging and retrying"
                git fetch origin main
                if ! git merge origin/main --no-edit; then
                  echo "merge conflict - aborting, will retry next scheduled run"
                  git merge --abort || true
                  break
                fi
                sleep $((RANDOM % 5 + 1))
              done
            fi
          fi
