name: Weekly creative-staleness check

# Prompted by a LinkedIn post (Arindam Paul, 2026-08-06) on auditing top-spending
# creatives for recency and concept diversity as the leading cause of accounts that
# can't scale Meta profitably. Same day as the existing weekly review
# (weekly-rule-pass.yml, Monday 08:00 UTC / 13:30 IST) but offset 30 min later to
# avoid overlapping runs, and entirely separate from it - this does not touch
# isolate/geo logic or the kill-pass, purely a reporting pass.
#
# DM-only by default (creative_staleness_check.py hardcodes --dm-only unless
# --post-to-channel is passed) - new report type, not yet reviewed for
# #growth-reports.
on:
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch: {}

jobs:
  staleness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run weekly creative-staleness check and DM Nikhil
        run: python creative_staleness_check.py
        env:
          WIOM_DASHBOARD_TOKEN: ${{ secrets.WIOM_DASHBOARD_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # SLACK_DM_USER_ID defaults to U05A9037VFG (Nikhil) - override here only if it changes.
