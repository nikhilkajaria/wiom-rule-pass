name: Play Store screenshot A/B - one-off full-week check

# One-off, NOT a recurring pass. Nikhil asked (2026-09-10) for a W-o-W click->install check
# once a full post-change week (Sep7-13) has matured - pinned to day=15, month=9 so this fires
# exactly once, on Tuesday 2026-09-15, rather than recurring. Posts to Slack DM only.
# Delete this file and playstore_ab_check.py after it's run and been reviewed.
on:
  schedule:
    - cron: '0 8 15 9 *'   # 08:00 UTC = 13:30 IST, 2026-09-15 only
  workflow_dispatch: {}     # lets Nikhil trigger it manually too

jobs:
  playstore-ab-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install google-ads google-auth
      - name: Run the check and post to Slack (DM only)
        run: python playstore_ab_check.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # SLACK_DM_USER_ID defaults to U05A9037VFG.
