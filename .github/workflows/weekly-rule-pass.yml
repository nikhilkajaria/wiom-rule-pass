name: Weekly BFC-VOLUME review

# The batched weekly edit (the core L1 + L3 rhythm, done together). Routine creative/geo edits
# happen here, not daily - trickling daily changes resets Meta's learning phase.
# Cron is UTC. '8 8 * * 1' = Monday ~13:38 IST - same time of day as the daily
# rule-pass (daily-rule-pass.yml), just weekly instead of daily. Moved from
# 11:30 IST 2026-07-15 alongside the daily pass.
# Minute offset (2026-09-16): staggered off the round hour along with every
# other daily/weekly pass in this repo, to avoid GH Actions' round-minute
# cron congestion (see daily-rule-pass.yml for the full writeup). This is
# the weekly counterpart to the main daily kill pass, so it gets the
# second-earliest offset (+8 min) of the six staggered workflows.
on:
  schedule:
    - cron: '8 8 * * 1'
  workflow_dispatch: {}

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run weekly review (full batched roster) and post to Slack
        run: python rule_pass.py --mode weekly
        env:
          WIOM_DASHBOARD_TOKEN: ${{ secrets.WIOM_DASHBOARD_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # SLACK_CHANNEL_ID defaults to #demand-reports (C0C216DU0P6); SLACK_DM_USER_ID to U05A9037VFG. Override here only if they change.
