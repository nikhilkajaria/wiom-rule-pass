name: Daily BHARAT_ALL_SPL + BHARAT_LUCKNOW_SPL monitors (DM only)

# 2026-10-11 (Nikhil: "put Lucknow and Bharat also like Mumbai ... 7-day reads"): replaces the Monday
# weekly-bharat-pass.yml. geo_daily_pass.py runs once per geo, DM only, with the same 3-attempt
# dashboard-readiness ladder as the Mumbai pass, offset +37 min (after Mumbai's +31).
#   08:37 UTC = 14:07 IST attempt 1 | 10:37 UTC = 16:07 IST attempt 2 | 12:37 UTC = 18:07 IST attempt 3 (last retry)
on:
  schedule:
    - cron: '37 8 * * *'
    - cron: '37 10 * * *'
    - cron: '37 12 * * *'
  workflow_dispatch: {}

jobs:
  geo-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # Same bug as weekly-rmkt-pass.yml, found 2026-09-08: this workflow never
        # had a pip install step, so get_actual_google_spend_day() has thrown
        # "No module named 'google'" on every scheduled run since inception,
        # readiness never returned True, and the real BHARAT_ALL_SPL review has
        # never actually executed - only the "giving up" DM alert ever fired.
        run: |
          pip install google-ads google-auth
      - name: Determine retry attempt
        id: retry
        run: |
          case "${{ github.event.schedule }}" in
            "37 8 * * *")  echo "flag=" >> "$GITHUB_OUTPUT" ;;
            "37 10 * * *") echo "flag=" >> "$GITHUB_OUTPUT" ;;
            "37 12 * * *") echo "flag=--last-retry" >> "$GITHUB_OUTPUT" ;;
            *)            echo "flag=--last-retry" >> "$GITHUB_OUTPUT" ;;  # workflow_dispatch - one shot
          esac
      - name: Run bharat daily pass and DM
        if: always()
        run: python geo_daily_pass.py --geo bharat ${{ steps.retry.outputs.flag }}
        env:
          WIOM_DASHBOARD_TOKEN: ${{ secrets.WIOM_DASHBOARD_TOKEN }}
          # bharat_weekly_pass.py itself never calls Meta/Google directly, but
          # dashboard_readiness.py's own actual-spend cross-check does
          # (get_actual_meta_spend_day()/get_actual_google_spend_day()) - missing
          # here caused actual_total to silently come back None ("actual=n/a" in
          # the run log) on 2026-09-07, so is_dashboard_data_ready() could never
          # return True and every scheduled run gave up without doing real work.
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # SLACK_DM_USER_ID defaults to U05A9037VFG. Override here only if it changes.
      - name: Run lucknow daily pass and DM
        if: always()
        run: python geo_daily_pass.py --geo lucknow ${{ steps.retry.outputs.flag }}
        env:
          WIOM_DASHBOARD_TOKEN: ${{ secrets.WIOM_DASHBOARD_TOKEN }}
          # bharat_weekly_pass.py itself never calls Meta/Google directly, but
          # dashboard_readiness.py's own actual-spend cross-check does
          # (get_actual_meta_spend_day()/get_actual_google_spend_day()) - missing
          # here caused actual_total to silently come back None ("actual=n/a" in
          # the run log) on 2026-09-07, so is_dashboard_data_ready() could never
          # return True and every scheduled run gave up without doing real work.
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # SLACK_DM_USER_ID defaults to U05A9037VFG. Override here only if it changes.
      - name: Commit state (budget snapshots + readiness markers)
        if: always()
        # Same pattern as weekly-rmkt-pass.yml's own commit step - own file
        # (geo_pass_state.json + per-geo readiness files), so nothing to merge/conflict against
        # any other pass's own state files.
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          for f in geo_pass_state.json bharat_daily_readiness_state.json lucknow_daily_readiness_state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if true; then
            if ! git diff --cached --quiet; then
              git commit -m "geo-daily state: $(date -u +%Y-%m-%d)"
              for i in 1 2 3 4 5; do
                if git push; then
                  break
                fi
                echo "push rejected (attempt $i) - fetching + merging and retrying"
                git fetch origin main
                if ! git merge origin/main --no-edit; then
                  echo "merge conflict - aborting, will retry next scheduled run"
                  git merge --abort || true
                  break
                fi
                sleep $((RANDOM % 5 + 1))
              done
            fi
          fi
