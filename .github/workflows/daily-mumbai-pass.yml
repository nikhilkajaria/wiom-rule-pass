name: Daily MUMBAI_CSP99_SPL monitor (DM only)

# Read-only daily read of the Mumbai Plan D ad set with the plan's dated tripwires - see
# mumbai_daily_pass.py. T3 (pass rate) and T5 (CPI, connections) depend on the growth-dashboard
# funnel, which has the same erratic D-1 ETL timing as every other dashboard-dependent pass
# (dashboard_readiness.py) - so this uses the SAME 3-attempt retry ladder as
# weekly-bharat-pass.yml/daily-rule-pass.yml, just daily instead of Monday-only (2026-09-12,
# Nikhil: "timings are also affected by growth dashboard data update").
#   08:31 UTC = 14:01 IST - attempt 1
#   10:31 UTC = 16:01 IST - attempt 2
#   12:31 UTC = 18:01 IST - attempt 3 (last retry - alerts DM instead of quietly postponing if
#                            data is still not ready)
#
# Minute offset (2026-09-16): staggered off the round hour along with every
# other daily/weekly pass in this repo, to avoid GH Actions' round-minute
# cron congestion (see daily-rule-pass.yml for the full writeup). This is a
# read-only DM-only monitor on the smallest, newest market, so it gets the
# lowest priority - last offset (+31 min) of the six staggered workflows.
on:
  schedule:
    - cron: '31 8 * * *'
    - cron: '31 10 * * *'
    - cron: '31 12 * * *'
  workflow_dispatch: {}

jobs:
  mumbai-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # dashboard_readiness.py's is_dashboard_data_ready() cross-checks actual Google spend
        # via the Google Ads API - same missing-pip-install bug weekly-bharat-pass.yml had
        # (found 2026-09-08: readiness silently never returned True without this).
        run: |
          pip install google-ads google-auth
      - name: Determine retry attempt
        id: retry
        run: |
          case "${{ github.event.schedule }}" in
            "31 8 * * *")  echo "flag=" >> "$GITHUB_OUTPUT" ;;
            "31 10 * * *") echo "flag=" >> "$GITHUB_OUTPUT" ;;
            "31 12 * * *") echo "flag=--last-retry" >> "$GITHUB_OUTPUT" ;;
            *)            echo "flag=--last-retry" >> "$GITHUB_OUTPUT" ;;  # workflow_dispatch - one shot
          esac
      - name: Run Mumbai daily pass and post to Slack (DM only)
        run: python mumbai_daily_pass.py ${{ steps.retry.outputs.flag }}
        env:
          WIOM_DASHBOARD_TOKEN: ${{ secrets.WIOM_DASHBOARD_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      - name: Commit state (learning-stage snapshots + readiness idempotency marker)
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add mumbai_pass_state.json mumbai_daily_readiness_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "mumbai-daily state: $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push rejected (attempt $i) - fetching + merging and retrying"
              git fetch origin main
              if ! git merge origin/main --no-edit; then
                echo "merge conflict - aborting, will retry next scheduled run"
                git merge --abort || true
                break
              fi
              sleep $((RANDOM % 5 + 1))
            done
          fi
