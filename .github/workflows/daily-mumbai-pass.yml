name: Daily MUMBAI_CSP99_SPL monitor (DM only)

# Read-only daily read of the Mumbai Plan D ad set with the plan's dated tripwires - see
# mumbai_daily_pass.py. Reads D-1 straight from Meta Insights, so no dashboard-readiness
# retry ladder: one shot at 05:00 UTC = 10:30 IST. Dashboard install-cohort fields are
# added when present and labelled as maturing.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  mumbai-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Mumbai daily pass and post to Slack (DM only)
        run: python mumbai_daily_pass.py
        env:
          WIOM_DASHBOARD_TOKEN: ${{ secrets.WIOM_DASHBOARD_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      - name: Commit state (daily learning-stage snapshots feed the 7d SPL count)
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          if [ -f mumbai_pass_state.json ]; then
            git add mumbai_pass_state.json
            if ! git diff --cached --quiet; then
              git commit -m "mumbai-pass state: $(date -u +%Y-%m-%d)"
              for i in 1 2 3 4 5; do
                if git push; then
                  break
                fi
                echo "push rejected (attempt $i) - fetching + merging and retrying"
                git fetch origin main
                if ! git merge origin/main --no-edit; then
                  echo "merge conflict - aborting, will retry next scheduled run"
                  git merge --abort || true
                  break
                fi
                sleep $((RANDOM % 5 + 1))
              done
            fi
          fi
